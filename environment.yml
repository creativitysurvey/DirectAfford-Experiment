name: directafford_env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch=2.0.1
  - torchvision=0.15.2
  - torchaudio=2.0.2
  - pytorch-cuda=11.8
  # PyTorch 2.0.1 wheels require the NumPy 1.x ABI.
  - numpy=1.26.4
  - tqdm
  - scikit-learn
  - pip
  - pip:
    - transformers
    - open3d
    - tensorboard
