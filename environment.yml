name: directafford_env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch=2.0.1
  - torchvision=0.15.2
  - torchaudio=2.0.2
  - pytorch-cuda=11.8
  # PyTorch 2.0.1 wheels require the NumPy 1.x ABI.
  - numpy=1.26.4
  - tqdm
  - scipy=1.11.4
  - scikit-learn=1.3.2
  - pip
  - pip:
    - transformers==4.35.2
    - tokenizers==0.15.2
    - huggingface-hub==0.23.5
    - safetensors==0.4.5
    - open3d
    - tensorboard

variables:
  PYTHONNOUSERSITE: "1"
